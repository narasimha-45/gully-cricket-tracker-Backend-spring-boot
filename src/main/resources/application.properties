spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:300000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Schema is owned by Flyway. Hibernate only verifies entity/schema compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.flyway.enabled=true
# Existing deployments created by Hibernate can be adopted without replaying V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Mongo is a one-off migration dependency only. Disable all Mongo auto-configuration
# during normal application startup so no Mongo client/socket is created.
# application-migration.properties clears this exclusion when that profile is explicitly active.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# Production observability. Expose only health/info/prometheus/metrics by default.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.com.gullycricket.backend=${APP_LOG_LEVEL:INFO}

# Comma-separated frontend origins, e.g. https://app.example.com,https://admin.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# Set in production to protect all mutating endpoints. Leave blank only for local development.
app.security.api-key=${APP_API_KEY:}

# Small in-memory caches for low-churn reference data and read-model responses.
# Match completion evicts season-match and leaderboard caches, preserving read-after-write consistency.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=120s,recordStats

# Performance diagnostics
app.performance.slow-request-ms=${SLOW_REQUEST_MS:300}
app.performance.slow-query-ms=${SLOW_QUERY_MS:150}

# Compress larger JSON responses such as profiles and season match lists.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/problem+json,text/plain,text/css,application/javascript

# Read-model JDBC guardrails. A leaderboard should never pin a request indefinitely.
spring.jdbc.template.fetch-size=100
spring.jdbc.template.query-timeout=${DB_READ_QUERY_TIMEOUT:5s}
