spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# Schema is owned by Flyway. Hibernate only verifies entity/schema compatibility.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
# Existing deployments created by Hibernate can be adopted without replaying V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Legacy Mongo is disabled as a repository source unless the migration profile is active.
spring.data.mongodb.repositories.enabled=false
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/gully-cricket}
spring.data.mongodb.database=${MONGO_DATABASE:gully-cricket}

# Production observability. Expose only health/info/prometheus by default.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.level.com.gullycricket.backend=${APP_LOG_LEVEL:INFO}

# Comma-separated frontend origins, e.g. https://app.example.com,https://admin.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# Set in production to protect all mutating endpoints. Leave blank only for local development.
app.security.api-key=${APP_API_KEY:}
